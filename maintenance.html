<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOP STORE | الصيانة</title>
<link rel="stylesheet" href="maintenance.css">
</head>
<body>
<div class="app">
<header>
  <div>
    <button id="backButton" type="button">← الرئيسية</button>
    <h1>🔧 إدارة الصيانة</h1>
    <p>تسجيل ومتابعة أجهزة العملاء</p>
  </div>
  <div class="user">
    <strong id="usernameDisplay">المستخدم</strong>
    <span id="roleDisplay">الموظف</span>
    <button id="logoutButton" type="button">🚪 خروج</button>
  </div>
</header>

<main>
<section class="card">
<h2>تسجيل صيانة جديدة</h2>
<form id="maintenanceForm">
<div class="grid">
<label>اسم العميل<input id="customerName" required></label>
<label>رقم الهاتف<input id="customerPhone"></label>
<label>نوع الجهاز<input id="device" required></label>
<label>IMEI / الرقم التسلسلي<input id="serial"></label>
<label class="full">العطل<input id="problem" required></label>
<label>التكلفة المتوقعة<input id="cost" type="number" min="0" value="0"></label>
<label>الحالة<select id="status">
<option>جديد</option><option>جاري العمل</option><option>جاهز</option><option>تم التسليم</option>
</select></label>
<label class="full">ملاحظات<textarea id="notes"></textarea></label>
</div>
<div class="actions">
<button class="primary" type="submit">💾 حفظ الصيانة</button>
<button type="button" id="clearButton">🧹 مسح</button>
</div>
</form>
</section>

<section class="card">
<div class="title"><h2>سجل الصيانة</h2><b id="maintenanceCount">0</b></div>
<div class="table-wrap">
<table>
<thead><tr><th>رقم</th><th>التاريخ</th><th>العميل</th><th>الهاتف</th><th>الجهاز</th><th>العطل</th><th>التكلفة</th><th>الحالة</th><th>إجراء</th></tr></thead>
<tbody id="maintenanceTable"></tbody>
</table>
</div>
<div id="emptyState" class="empty">لا توجد عمليات صيانة حتى الآن.</div>
</section>
</main>
</div>

<script src="permissions.js"></script>
<script src="maintenance.js"></script>
</body>
</html>
