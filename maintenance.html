<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOP STORE | الصيانة</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f7fb;color:#172033}
.page{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;background:#fff;padding:18px 22px;border-radius:18px;box-shadow:0 8px 25px #0000000d;margin-bottom:20px}
h1,h2,p{margin-top:0}.top h1{margin:0}.user{color:#667085}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 25px #0000000d;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}label{display:block;font-weight:bold;margin-bottom:7px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8dee9;border-radius:10px;font-size:15px}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}button{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:bold}.primary{background:#159bd7;color:#fff}.danger{background:#ef4444;color:#fff}.back{background:#e8eef5;color:#172033}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #edf0f5;text-align:right;white-space:nowrap}.badge{padding:5px 9px;border-radius:20px;background:#e8f7ee;color:#198754}.empty{text-align:center;padding:30px;color:#777}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="page">

<div class="top">
    <div>
        <h1>🔧 الصيانة</h1>
        <p>تسجيل ومتابعة أجهزة الصيانة</p>
    </div>
    <div class="user">
        <span id="usernameDisplay">المستخدم</span> -
        <span id="roleDisplay">الموظف</span>
    </div>
</div>

<div class="card">
<h2>تسجيل صيانة جديدة</h2>

<form id="maintenanceForm">
<div class="grid">
<div><label>اسم العميل</label><input id="customerName" required></div>
<div><label>رقم الهاتف</label><input id="customerPhone"></div>
<div><label>نوع الجهاز</label><input id="device" required></div>
<div><label>IMEI / الرقم التسلسلي</label><input id="serial"></div>
<div><label>العطل</label><input id="problem" required></div>
<div><label>التكلفة المتوقعة</label><input id="cost" type="number" min="0" value="0"></div>
<div><label>حالة الجهاز</label>
<select id="status">
<option value="جديد">جديد</option>
<option value="جاري العمل">جاري العمل</option>
<option value="جاهز">جاهز</option>
<option value="تم التسليم">تم التسليم</option>
</select>
</div>
<div><label>ملاحظات</label><textarea id="notes"></textarea></div>
</div>

<div class="actions">
<button class="primary" type="submit">➕ حفظ الصيانة</button>
<button class="back" type="reset">مسح الحقول</button>
<button class="back" type="button" onclick="location.href='dashboard.html'">🏠 الرئيسية</button>
<button class="danger" id="logoutButton" type="button">🚪 تسجيل الخروج</button>
</div>
</form>
</div>

<div class="card">
<h2>سجل الصيانة</h2>
<div class="table-wrap">
<table>
<thead><tr><th>التاريخ</th><th>العميل</th><th>الجهاز</th><th>العطل</th><th>التكلفة</th><th>الحالة</th><th>إجراء</th></tr></thead>
<tbody id="maintenanceTable"></tbody>
</table>
</div>
<div id="empty" class="empty">لا توجد أجهزة صيانة حتى الآن.</div>
</div>

</div>

<script src="permissions.js"></script>
<script src="maintenance.js"></script>
</body>
</html>
