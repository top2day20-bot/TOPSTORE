<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="TOP STORE - نظام إدارة المبيعات والمخزن">

    <title>TOP STORE | تسجيل الدخول</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="brand">

                <div class="brand-icon">
                    <span>TS</span>
                </div>

                <h1>TOP STORE</h1>

                <p>نظام إدارة المبيعات والمخزن</p>

            </div>


            <form id="loginForm" class="login-form">

                <div class="input-group">

                    <label for="username">
                        اسم المستخدم
                    </label>

                    <div class="input-box">

                        <span class="input-icon">👤</span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="أدخل اسم المستخدم"
                            autocomplete="username"
                            required>

                    </div>

                </div>


                <div class="input-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <div class="input-box">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="أدخل كلمة المرور"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="إظهار كلمة المرور">
                            👁
                        </button>

                    </div>

                </div>


                <div id="loginMessage"
                     class="login-message"
                     role="alert">
                </div>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button">

                    <span class="button-text">
                        تسجيل الدخول
                    </span>

                    <span class="button-loader"></span>

                </button>

            </form>


            <div class="login-footer">

                <span>TOP STORE</span>

                <span>•</span>

                <span>نظام إدارة المتجر</span>

            </div>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
