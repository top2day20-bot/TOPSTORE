<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOP STORE | المستخدمين والصلاحيات</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:Arial,Tahoma,sans-serif;color:#172033}.page{max-width:1200px;margin:auto;padding:20px}.top,.card{background:#fff;border-radius:18px;box-shadow:0 8px 25px #0000000d;padding:20px;margin-bottom:20px}.top{display:flex;justify-content:space-between;gap:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{font-weight:bold;display:block;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #d8dee9;border-radius:10px}.permissions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.permissions label{font-weight:normal;background:#f6f8fb;padding:10px;border-radius:9px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}button{border:0;border-radius:10px;padding:11px 16px;font-weight:bold;cursor:pointer}.primary{background:#159bd7;color:#fff}.danger{background:#ef4444;color:#fff}.back{background:#e8eef5}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #edf0f5;text-align:right;white-space:nowrap}.role{font-weight:bold}.hint{color:#667085}@media(max-width:700px){.grid,.permissions{grid-template-columns:1fr}.top{flex-direction:column}}
</style>
</head>
<body>
<div class="page">

<div class="top">
<div><h1>👥 المستخدمين والصلاحيات</h1><p>المدير يستطيع تحديد صلاحيات كل موظف.</p></div>
<div><span id="usernameDisplay">المستخدم</span> - <span id="roleDisplay">الموظف</span></div>
</div>

<div class="card">
<h2>إضافة مستخدم</h2>
<p class="hint">لا يمكن تعديل صلاحيات المدير من هنا؛ المدير له كل الصلاحيات.</p>

<form id="userForm">
<div class="grid">
<div><label>اسم المستخدم</label><input id="newUsername" required></div>
<div><label>اسم الموظف</label><input id="newName" required></div>
<div><label>كلمة المرور</label><input id="newPassword" type="password" required></div>
</div>

<div class="permissions">
<label><input type="checkbox" name="perm" value="sales" checked> المبيعات</label>
<label><input type="checkbox" name="perm" value="products" checked> المنتجات والمخزن</label>
<label><input type="checkbox" name="perm" value="returns" checked> المرتجعات</label>
<label><input type="checkbox" name="perm" value="maintenance" checked> الصيانة</label>
<label><input type="checkbox" name="perm" value="accounts"> الحسابات</label>
<label><input type="checkbox" name="perm" value="expenses"> المصروفات</label>
<label><input type="checkbox" name="perm" value="reports"> التقارير</label>
<label><input type="checkbox" name="perm" value="users"> المستخدمين</label>
</div>

<div class="actions">
<button class="primary" type="submit">➕ إضافة المستخدم</button>
<button class="back" type="button" onclick="location.href='dashboard.html'">🏠 الرئيسية</button>
<button class="danger" id="logoutButton" type="button">🚪 تسجيل الخروج</button>
</div>
</form>
</div>

<div class="card">
<h2>المستخدمون الحاليون</h2>
<div class="table-wrap">
<table>
<thead><tr><th>المستخدم</th><th>الاسم</th><th>الدور</th><th>الصلاحيات</th><th>الحالة</th><th>إجراء</th></tr></thead>
<tbody id="usersTable"></tbody>
</table>
</div>
</div>

</div>
<script src="permissions.js"></script>
<script src="users.js"></script>
</body>
</html>
